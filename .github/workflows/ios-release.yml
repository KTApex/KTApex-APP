name: iOS Release (Signed IPA)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Distribution method"
        required: true
        default: "app-store"
        type: choice
        options:
          - app-store
          - ad-hoc
          - development

env:
  # Use the runner's default (latest) Xcode, matching the pre-installed iOS SDK.
  SCHEME: MyVault

jobs:
  release:
    name: Archive and Export IPA
    runs-on: macos-15
    env:
      # Optional: a profile for the widget extension's bundle id (<BUNDLE_IDENTIFIER>.widget).
      # Providing it lets the embedded extension be signed with manual signing
      # materials; without it Xcode must resolve a profile for the extension itself.
      WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate signing secrets
        run: |
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID BUNDLE_IDENTIFIER; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; exit 1; fi
          done
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}

      - name: Set up temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # A freshly created keychain is not searched by default, so codesign would
          # never find the identity imported below. Prepend it to the user search list
          # while keeping the runner's existing keychains.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security list-keychains -d user
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/MyVault.mobileprovision

      - name: Install widget provisioning profile
        if: env.WIDGET_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/MyVaultWidget.mobileprovision
          echo "Installed a second profile for the embedded widget extension."

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          EXPORT_METHOD="${{ inputs.export_method }}"
          /usr/libexec/PlistBuddy -c "Set method $EXPORT_METHOD" ExportOptions.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add method string $EXPORT_METHOD" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set teamID $APPLE_TEAM_ID" ExportOptions.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add teamID string $APPLE_TEAM_ID" ExportOptions.plist
          echo "Exporting with method: $EXPORT_METHOD (team hidden)"

      - name: Archive
        id: archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          set -o pipefail
          # Override BUNDLE_IDENTIFIER, not PRODUCT_BUNDLE_IDENTIFIER: the project derives
          # PRODUCT_BUNDLE_IDENTIFIER from it ("$(BUNDLE_IDENTIFIER)") and the widget
          # extension appends ".widget". Setting PRODUCT_BUNDLE_IDENTIFIER directly would
          # give the app and the widget the same id, which cannot be signed or embedded.
          xcodebuild archive \
            -project MyVault.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyVault.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Show archive errors
        if: failure() && steps.archive.outcome == 'failure'
        run: |
          echo "=========== ARCHIVE DIAGNOSTICS (signing included) ==========="
          grep -E "error: |Code Signing Error|requires a provisioning profile|No profiles for|No signing certificate|BUILD FAILED|The following build commands failed" "$RUNNER_TEMP/archive.log" | head -15 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo "=========== LAST 60 LINES ==========="
          tail -n 60 "$RUNNER_TEMP/archive.log" || true
          echo "======================================"

      - name: Export IPA
        id: export
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MyVault.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Show export errors
        if: failure() && steps.export.outcome == 'failure'
        run: |
          echo "=========== EXPORT DIAGNOSTICS ==========="
          grep -E "error: |errorCode|Code Signing Error|requires a provisioning profile|No profiles for|No signing certificate" "$RUNNER_TEMP/export.log" | head -15 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo "=========== LAST 60 LINES ==========="
          tail -n 60 "$RUNNER_TEMP/export.log" || true
          echo "======================================"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-ipa
          path: ${{ runner.temp }}/ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
