name: iOS Unsigned IPA

# Builds an unsigned (ad-hoc signed) device IPA without any Apple Developer
# credentials. The resulting IPA cannot be installed directly; re-sign it with
# a tool like AltStore/Sideloadly (free Apple ID) before sideloading.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"
  workflow_dispatch:

env:
  SCHEME: MyVault
  PROJECT: MyVault.xcodeproj
  BUNDLE_IDENTIFIER: com.ktapex.myvault

jobs:
  unsigned-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned device binary
        id: build
        run: |
          set -o pipefail
          # CODE_SIGNING_ALLOWED=NO produces a fully unsigned device binary:
          # ad-hoc signing (CODE_SIGN_IDENTITY="-") is rejected by recent SDKs
          # ("Ad Hoc code signing is not allowed"), so signing must be skipped.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "=========== BUILD DIAGNOSTICS ==========="
          grep -E "error: |Code Signing|requires a provisioning profile|No profiles|BUILD FAILED|The following build commands failed" "$RUNNER_TEMP/build.log" | head -20 || true
          echo "=========== LAST 60 LINES ==========="
          tail -n 60 "$RUNNER_TEMP/build.log" || true

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then echo "::error::No .app found in build products"; ls -R "$RUNNER_TEMP/DerivedData/Build/Products" || true; exit 1; fi
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # SwiftSupport is optional for ad-hoc re-signing; skip it.
          zip -ry MyVault-unsigned.ipa Payload
          ls -lh MyVault-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-unsigned-ipa
          path: ${{ runner.temp }}/MyVault-unsigned.ipa
