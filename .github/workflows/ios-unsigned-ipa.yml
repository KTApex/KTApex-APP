name: iOS Unsigned IPA

# Builds an unsigned (ad-hoc signed) device IPA without any Apple Developer
# credentials. The resulting IPA cannot be installed directly; re-sign it with
# a tool like AltStore/Sideloadly (free Apple ID) before sideloading.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"
  workflow_dispatch:

env:
  SCHEME: MyVault
  PROJECT: MyVault.xcodeproj
  BUNDLE_IDENTIFIER: com.ktapex.myvault

jobs:
  unsigned-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write empty entitlements
        run: |
          cat > "$GITHUB_WORKSPACE/empty.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          EOF

      - name: Archive (ad-hoc signed, no provisioning profile)
        id: archive
        run: |
          set -o pipefail
          # CODE_SIGN_IDENTITY="-" is ad-hoc signing: no certificate, no team,
          # no profile. Entitlements that require a real profile (App Groups,
          # iCloud) are replaced with an empty file so codesign can succeed.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyVault.xcarchive" \
            BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/empty.entitlements" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Show archive errors
        if: failure() && steps.archive.outcome == 'failure'
        run: |
          echo "=========== ARCHIVE DIAGNOSTICS ==========="
          grep -E "error: |Code Signing|requires a provisioning profile|No profiles|BUILD FAILED|The following build commands failed" "$RUNNER_TEMP/archive.log" | head -20 || true
          echo "=========== LAST 60 LINES ==========="
          tail -n 60 "$RUNNER_TEMP/archive.log" || true

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/MyVault.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then echo "::error::No .app found in archive"; exit 1; fi
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # SwiftSupport is optional for ad-hoc re-signing; skip it.
          zip -ry MyVault-unsigned.ipa Payload
          ls -lh MyVault-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyVault-unsigned-ipa
          path: ${{ runner.temp }}/MyVault-unsigned.ipa
