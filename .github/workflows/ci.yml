name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  XCODE_VERSION: "16.2"
  SCHEME: MyVault
  PROJECT: MyVault.xcodeproj

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve bundle identifier
        id: bundle
        run: echo "BUNDLE_IDENTIFIER=${BUNDLE_ID:-com.ktapex.myvault}" >> "$GITHUB_OUTPUT"

      - name: Resolve simulator
        id: sim
        run: |
          SIM="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            SIM=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^[[:space:]]*(.*) \(.*/\1/')
          fi
          echo "resolved simulator: $SIM"
          echo "SIM=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build (clean)
        run: |
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM }}" \
            -derivedDataPath DerivedData \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit and UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
