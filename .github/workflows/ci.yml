name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Use the runner's default (latest) Xcode, which ships with a matching iOS
  # Simulator runtime. Pinning an old version (e.g. 16.2) causes "iOS X not
  # installed" because that SDK's runtime is not present on macos-15 runners.
  SCHEME: MyVault
  PROJECT: MyVault.xcodeproj

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available runtimes
        run: xcrun simctl list runtimes

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve bundle identifier
        id: bundle
        run: echo "BUNDLE_IDENTIFIER=${BUNDLE_ID:-com.ktapex.myvault}" >> "$GITHUB_OUTPUT"

      - name: Build (clean)
        id: build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
        continue-on-error: true

      - name: Show build errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========== ALL DIAGNOSTIC LINES (error/warning) ==========="
          grep -nE "(error|warning|note):|Undefined symbols|ld: |clang: error|BUILD FAILED|The following build commands failed" build.log || true
          echo ""
          echo "=========== LAST 120 LINES OF BUILD LOG ==========="
          tail -n 120 build.log
          echo "=================================================="

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Run unit and UI tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Show test failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "=========== TEST FAILURES ==========="
          grep -nE "error:|failed|Failing tests|XCTAssert|Test Case .* failed|\\*\\* TEST FAILED" test.log || true
          echo ""
          echo "=========== LAST 120 LINES ==========="
          tail -n 120 test.log
          echo "====================================="

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
