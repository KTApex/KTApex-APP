name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  XCODE_VERSION: "16.2"
  SCHEME: MyVault
  PROJECT: MyVault.xcodeproj

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS platform (required for simulator build)
        run: |
          # The macos-15 runner's Xcode 16.2 does not ship with an installed iOS
          # platform/SDK, so simulator destinations are unavailable until we
          # download it. This is Apple's supported mechanism and is idempotent.
          sudo xcodebuild -downloadPlatform iOS 2>/dev/null || true

      - name: Ensure a simulator device exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            # No simulator devices yet — create one against the newest runtime.
            RUNTIME_ID=$(xcrun simctl list runtimes | grep -E "iOS" | grep -v unavailable | head -1 | sed -E 's/^([A-Za-z0-9.-]+) .*/\1/')
            echo "creating simulator with runtime $RUNTIME_ID"
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME_ID"
          fi
          echo "--- available devices ---"
          xcrun simctl list devices available | grep -E "iPhone" || true

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve bundle identifier
        id: bundle
        run: echo "BUNDLE_IDENTIFIER=${BUNDLE_ID:-com.ktapex.myvault}" >> "$GITHUB_OUTPUT"

      - name: Resolve simulator
        id: sim
        run: |
          # Prefer a concrete iPhone name; fall back to the newest available
          # iPhone simulator if "iPhone 16" is not present on this runner.
          SIM="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            SIM=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^[[:space:]]*(.*) \(.*/\1/')
            if [ -z "$SIM" ]; then
              SIM=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^[[:space:]]*(.*) \([0-9A-F-]*\).*/\1/')
            fi
          fi
          echo "resolved simulator: $SIM"
          echo "SIM=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build (clean)
        run: |
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM }}" \
            -derivedDataPath DerivedData \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit and UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.SIM }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
