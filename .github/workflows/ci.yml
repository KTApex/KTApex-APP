name: CI

on:
  push:
    # Feature branches are included so in-progress work gets compiled and tested
    # before it reaches main. Remove "feat/**" if you prefer CI to run on PRs only.
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Use the runner's default (latest) Xcode, which ships with a matching iOS
  # Simulator runtime. Pinning an old version (e.g. 16.2) causes "iOS X not
  # installed" because that SDK's runtime is not present on macos-15 runners.
  SCHEME: MyVault
  PROJECT: MyVault.xcodeproj

  # Simulator builds must stay code-signed: an unsigned app gets -34018
  # (errSecMissingEntitlement) from every Keychain call, so integration tests
  # (PIN/vault key) silently fail. `-` is ad-hoc signing — no certificate needed.
jobs:
  build-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available runtimes
        run: xcrun simctl list runtimes

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve bundle identifier
        id: bundle
        run: echo "BUNDLE_IDENTIFIER=${BUNDLE_ID:-com.ktapex.myvault}" >> "$GITHUB_OUTPUT"

      - name: Build (clean)
        id: build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build.log
        continue-on-error: true

      - name: Show build errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========== ALL DIAGNOSTIC LINES (error/warning) ==========="
          grep -nE "(error|warning|note):|Undefined symbols|ld: |clang: error|BUILD FAILED|The following build commands failed" build.log || true
          # Mirror the first diagnostics as check annotations: they are visible in the
          # Actions UI and via the public check-run API without downloading artifacts.
          grep -E "(error|warning): |BUILD FAILED|The following build commands failed" build.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo ""
          echo "=========== LAST 120 LINES OF BUILD LOG ==========="
          tail -n 120 build.log
          echo "=================================================="

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -only-testing:MyVaultTests \
            -resultBundlePath UnitTests.xcresult \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee unit-test.log

      - name: Show unit test failures
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "=========== UNIT TEST FAILURES ==========="
          grep -nE "error:|XCTAssert|Test Case .* failed|failed \\(|\\*\\* TEST FAILED" unit-test.log || true
          # Mirror the first failures as check annotations (visible without the artifacts).
          grep -E "error: |XCTAssert|Test Case .* failed|TEST FAILED" unit-test.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo "=========== LAST 120 LINES ==========="
          tail -n 120 unit-test.log
          echo "====================================="

      - name: Run UI tests
        id: ui_tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -only-testing:MyVaultUITests \
            -resultBundlePath UITests.xcresult \
            BUNDLE_IDENTIFIER="${{ steps.bundle.outputs.BUNDLE_IDENTIFIER }}" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee ui-test.log

      - name: Show UI test failures
        if: steps.ui_tests.outcome == 'failure'
        run: |
          echo "=========== UI TEST FAILURES ==========="
          grep -nE "error:|XCTAssert|Test Case .* failed|failed \\(|\\*\\* TEST FAILED" ui-test.log || true
          # Mirror the first failures as check annotations (visible without the artifacts).
          grep -E "error: |XCTAssert|Test Case .* failed|TEST FAILED" ui-test.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo "=========== LAST 120 LINES ==========="
          tail -n 120 ui-test.log
          echo "==================================="

      - name: Fail if any tests failed
        if: steps.unit_tests.outcome == 'failure' || steps.ui_tests.outcome == 'failure'
        run: exit 1

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            unit-test.log
            ui-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            UnitTests.xcresult
            UITests.xcresult
